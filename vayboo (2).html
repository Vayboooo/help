<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vayboo — всё для стримеров</title>
<link rel="icon" id="fav" href="">
<style>
:root{--blue:#1f5bff;--sky:#27d8ff;--ice:#bff3ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:#fff;background:#020a22;overflow:hidden;position:relative}
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.75;animation:drift 16s ease-in-out infinite}
.aurora i:nth-child(1){width:60vw;height:60vw;background:#0a3cff;left:-15vw;top:-20vw}
.aurora i:nth-child(2){width:50vw;height:50vw;background:#00c8ff;right:-12vw;top:10vh;opacity:.45;animation-delay:-5s}
.aurora i:nth-child(3){width:55vw;height:40vw;background:#5b2bff;left:25vw;bottom:-25vw;opacity:.4;animation-delay:-9s}
@keyframes drift{50%{transform:translate(6vw,4vh) scale(1.12)}}
.grid{position:fixed;left:-50%;width:200%;bottom:-8%;height:55vh;z-index:1;
  background:linear-gradient(rgba(39,216,255,.35) 1px,transparent 1px) 0 0/80px 80px,linear-gradient(90deg,rgba(39,216,255,.35) 1px,transparent 1px) 0 0/80px 80px;
  transform:perspective(500px) rotateX(62deg);transform-origin:50% 100%;
  -webkit-mask-image:linear-gradient(to top,#000 0%,transparent 85%);mask-image:linear-gradient(to top,#000 0%,transparent 85%);animation:flow 3s linear infinite}
@keyframes flow{to{background-position:0 80px,0 0}}
canvas{position:fixed;inset:0;z-index:2}
.spot{position:fixed;z-index:3;width:600px;height:600px;margin:-300px 0 0 -300px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(39,216,255,.20),transparent 62%);mix-blend-mode:screen;left:50%;top:45%;transition:left .25s ease-out,top .25s ease-out}
.vig{position:fixed;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 35%,rgba(2,10,34,.88) 100%)}
.noise{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
main{position:relative;z-index:4;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px;perspective:1000px}
@keyframes rise{from{opacity:0;transform:translateY(34px) scale(.97)}to{opacity:1;transform:none}}
.stage{position:relative;width:min(440px,76vw);aspect-ratio:425/323;display:grid;place-items:center;transition:transform .2s ease-out;animation:rise 1.2s cubic-bezier(.2,.8,.2,1) both}
.halo{position:absolute;width:150%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(39,216,255,.55) 0%,rgba(31,91,255,.25) 40%,transparent 68%);animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.12);opacity:.8}}
.ring{position:absolute;border-radius:50%;border:1px solid rgba(39,216,255,.35)}
.r1{width:135%;aspect-ratio:1;animation:rot 30s linear infinite}
.r2{width:175%;aspect-ratio:1;border-color:rgba(31,91,255,.35);animation:rot 50s linear infinite reverse}
.r3{width:215%;aspect-ratio:1;border-color:rgba(39,216,255,.12);border-style:dashed;animation:rot 90s linear infinite}
.ring::after{content:"";position:absolute;top:50%;left:-5px;width:10px;height:10px;border-radius:50%;background:var(--ice);box-shadow:0 0 16px 5px var(--sky)}
.r3::after{display:none}
@keyframes rot{to{transform:rotate(360deg)}}
.lw{position:relative;width:100%;animation:bob 6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-16px) rotate(-1.5deg)}}
.lw img{display:block;width:100%;filter:drop-shadow(0 0 28px rgba(39,216,255,.65)) drop-shadow(0 30px 40px rgba(0,20,120,.7))}
.sweep{position:absolute;inset:0;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.9) 50%,transparent 58%) 0 0/300% 100%;
  -webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;mix-blend-mode:overlay;animation:sweep 5.5s ease-in-out infinite}
@keyframes sweep{0%{background-position:130% 0}45%,100%{background-position:-60% 0}}
h1{margin-top:24px;font-size:clamp(60px,13vw,150px);font-weight:900;letter-spacing:-4px;line-height:.95;display:flex;justify-content:center;
  filter:drop-shadow(0 8px 30px rgba(39,216,255,.35))}
h1 span{display:inline-block;background:linear-gradient(100deg,#fff 0%,var(--ice) 25%,var(--sky) 50%,var(--blue) 75%,var(--sky) 100%);background-size:600% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 7s linear infinite,rise 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:0s,calc(.5s + var(--i)*.08s);transition:transform .3s}
h1 span:hover{transform:translateY(-10px)}
@keyframes shine{to{background-position:-600% 0}}
.tag{margin-top:18px;font-size:clamp(13px,2vw,19px);letter-spacing:.55em;text-transform:uppercase;color:#a9d8ff;font-weight:500;padding-left:.55em;animation:rise 1s 1.1s cubic-bezier(.2,.8,.2,1) both}
.line{margin-top:14px;height:24px;font-size:clamp(13px,1.8vw,16px);color:rgba(169,216,255,.75);letter-spacing:.08em;animation:rise 1s 1.3s both;position:relative;width:100%}
.line b{position:absolute;left:0;right:0;font-weight:400;opacity:0;transform:translateY(8px);transition:.7s}
.line b.on{opacity:1;transform:none}
.soon{position:relative;margin-top:30px;padding:16px 40px 16px calc(40px + .3em);border-radius:999px;font-weight:700;font-size:15px;letter-spacing:.3em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:14px;background:rgba(255,255,255,.06);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);isolation:isolate;
  animation:rise 1s 1.5s cubic-bezier(.2,.8,.2,1) both;transition:transform .25s}
.soon:hover{transform:translateY(-3px) scale(1.03)}
.soon::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;z-index:-1;
  background:conic-gradient(from var(--a,0deg),transparent 0 60%,var(--sky) 80%,#fff 90%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spinb 3.5s linear infinite}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spinb{to{--a:360deg}}
.soon::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-2;box-shadow:0 0 50px rgba(39,216,255,.28),inset 0 0 30px rgba(39,216,255,.12)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--sky);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(39,216,255,.8)}70%,100%{box-shadow:0 0 0 14px rgba(39,216,255,0)}}
footer{position:fixed;bottom:18px;left:0;right:0;z-index:6;text-align:center;font-size:12px;letter-spacing:.2em;color:rgba(169,216,255,.5)}
@media(max-width:600px){.tag{letter-spacing:.3em;padding-left:.3em}.soon{font-size:12px;padding:14px 24px 14px calc(24px + .3em)}h1{letter-spacing:-2px}.spot{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

document.getElementById('h').innerHTML=[...'Vayboo'].map((ch,i)=>`<span style="--i:${i}">${ch}</span>`).join('');
// rotating line
const words=['Виджеты и оверлеи для OBS','Заказ треков от зрителей','Рулетки и аукционы','Клипы и нарезки','Рейтинги вашего чата'];
const ln=document.getElementById('line');
ln.innerHTML=words.map(w=>`<b>${w}</b>`).join('');
const bs=ln.children;let k=0;bs[0].classList.add('on');
setInterval(()=>{bs[k].classList.remove('on');k=(k+1)%bs.length;bs[k].classList.add('on')},2600);
// canvas
const cv=document.getElementById('c'),x=cv.getContext('2d');
let W,H,P=[],S=[],mx=-999,my=-999;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;
  const n=Math.min(120,Math.floor(W*H/13000));
  P=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:-Math.random()*.35-.05,r:Math.random()*1.6+.4,t:Math.random()*6}))}
size();addEventListener('resize',size);
const stage=document.getElementById('stage'),spot=document.getElementById('spot');
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;
  const dx=e.clientX/innerWidth-.5,dy=e.clientY/innerHeight-.5;
  stage.style.transform=`rotateY(${dx*16}deg) rotateX(${-dy*16}deg) translate(${dx*14}px,${dy*10}px)`;
  spot.style.left=e.clientX+'px';spot.style.top=e.clientY+'px'});
function loop(){
  x.clearRect(0,0,W,H);
  for(const p of P){
    p.x+=p.vx;p.y+=p.vy;p.t+=.03;
    if(p.y<-5){p.y=H+5;p.x=Math.random()*W}
    if(p.x<-5)p.x=W+5;if(p.x>W+5)p.x=-5;
    const a=.35+.35*Math.sin(p.t);
    x.shadowColor='#27d8ff';x.shadowBlur=8;
    x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle=`rgba(170,240,255,${a})`;x.fill();
    const d=Math.hypot(p.x-mx,p.y-my);
    if(d<170){x.shadowBlur=0;x.strokeStyle=`rgba(39,216,255,${(1-d/170)*.5})`;x.lineWidth=1;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(mx,my);x.stroke()}
  }
  // shooting stars
  if(Math.random()<.006)S.push({x:Math.random()*W*.9,y:Math.random()*H*.4,l:0});
  x.shadowBlur=0;
  for(let i=S.length-1;i>=0;i--){const s=S[i];s.x+=9;s.y+=4.5;s.l++;
    const g=x.createLinearGradient(s.x,s.y,s.x-90,s.y-45);g.addColorStop(0,'rgba(210,250,255,.9)');g.addColorStop(1,'rgba(39,216,255,0)');
    x.strokeStyle=g;x.lineWidth=1.6;x.beginPath();x.moveTo(s.x,s.y);x.lineTo(s.x-90,s.y-45);x.stroke();
    if(s.l>70)S.splice(i,1)}
  requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
